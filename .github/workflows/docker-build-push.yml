name: Build and Push to Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - website

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: lsg93080/cloud-website:latest
          build-args: |
            VITE_AUTH_SERVICE_URL=https://vitrina.diinf.usach.cl/auth/api/v1
            VITE_VITRINA_URL=https://vitrina.diinf.usach.cl/vitrina/
            VITE_HOST_URL=https://vitrina.diinf.usach.cl/cloud/
            VITE_S01_URL=https://vitrina.diinf.usach.cl/cloud/api/get
            VITE_S02_URL=https://vitrina.diinf.usach.cl/cloud/api/post
            VITE_S10_URL=https://vitrina.diinf.usach.cl/cloud/api/attributes
            VITE_S11_URL=https://vitrina.diinf.usach.cl/cloud/api/users
            VITE_FIREBASE_API_KEY=AIzaSyBQMvGjZMXESYUzYWFpw_gWMxG3cHWODgM
            VITE_FIREBASE_AUTH_DOMAIN=lsg-platform.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=lsg-platform
            VITE_FIREBASE_STORAGE_BUCKET=lsg-platform.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=666028254953
            VITE_FIREBASE_APP_ID=1:666028254953:web:a94dab6bedb99b2272f278
